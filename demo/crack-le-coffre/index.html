<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex">
<title>Crack le Coffre — démo jouable</title>
<style>
  html,body{margin:0;height:100%;background:#14161c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}

  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b8860b}
  .lnk{margin-top:16px;background:none;border:0;color:#8a7a6a;font-size:15px;text-decoration:underline;cursor:pointer}
  #form{display:none;margin-top:4px}
  #form input[type=email]{width:100%;box-sizing:border-box;padding:14px;font-size:17px;border:2px solid #d8c9b6;border-radius:12px;margin-bottom:10px}
  #ok{display:none;font-weight:700;color:#2e7d32;font-size:17px}

<body>
<div id="wrap"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="end"><div id="card">
  <h2>Bravo&nbsp;! 🎉</h2>
  <p id="endtxt">Tu as terminé la démo. Le jeu complet arrive bientôt sur Android, avec des centaines de coffres à ouvrir et un musée du butin à remplir.</p>
  <button class="btn" id="cta">Je veux le jeu complet</button>
  <div id="form"><p>Laisse ton e-mail pour être prévenu à la sortie.</p>
    <form id="f"><input type="hidden" name="jeu" value="Crack le Coffre (démo)"><input type="email" name="email" placeholder="ton@email.com" required><button class="btn" type="submit">Prévenez-moi</button></form></div>
  <div id="ok">C’est noté ! On te prévient dès la sortie.</div>
  <button class="lnk" id="again">Rejouer la démo</button>
</div></div>
<script>
// Crack le Coffre — démo jouable 3 niveaux (page de test du concept). « Tourne. Aligne. Ouvre. »
const W = 1080, H = 1920;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

// ---------- modèle (repris de la scène pub : anneaux concentriques, 6 secteurs) ----------

const LEVELS = [
  { r0: 170, offs: [0, 4], links: [], moves: 8 },

const aligned = o => o.every(x => ((x - o[0]) % NS + NS) % NS === 0);

function simRandom(li, trials) { const L = LEVELS[li]; let win = 0;
  for (let n = 0; n < trials; n++) { let o = L.offs.slice();
    for (let m = 0; m < L.moves; m++) { o = stepState(o, moveVec(L, Math.floor(Math.random() * o.length))); if (aligned(o)) { win++; break; } } }

}
function intOffsets(t) { return RINGS.map((_, i) => { let o = RINGS[i].off; for (const r of ROTS) if (r.ring === i && t >= r.t + ROT_DUR) o += r.d; return o; }); }
const colorAt = (i, k, o) => RINGS[i].seq[(((k - o) % NS) + NS) % NS];
function alignedSpokes(t) { const offs = intOffsets(t); const res = [];
  for (let k = 0; k < NS; k++) { const c0 = colorAt(0, k, offs[0]); res.push(RINGS.every((_, i) => colorAt(i, k, offs[i]) === c0)); } return res; }
const ringMid = i => R0 + i * RW + (RW - 8) / 2;

// ---------- dessin (repris de la scène pub) ----------
function drawVaultBg() { const g = ctx.createRadialGradient(CX, CY, 100, CX, CY, 1300); g.addColorStop(0, '#3a3f4b'); g.addColorStop(1, '#14161c'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.06)'; for (let y = 120; y < H; y += 160) for (let x = 60; x < W; x += 160) { ctx.beginPath(); ctx.arc(x, y, 8, 0, 7); ctx.fill(); } }
function drawGem(color, x, y, r, ang) { ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r * .8, 0); ctx.lineTo(0, r); ctx.lineTo(-r * .8, 0); ctx.closePath();

    const rot = ROTS.find(r => r.ring === i && t >= r.t && t < r.t + ROT_DUR + .12); const rotating = !!rot;

      if (HEX) { const b0 = (k + o) * Math.PI / 3 - Math.PI / 2 - Math.PI / 6, b1 = b0 + Math.PI / 3; const P = (r, b) => [CX + Math.cos(b) * r, CY + Math.sin(b) * r]; const mix = (A, B, u) => [A[0] + (B[0] - A[0]) * u, A[1] + (B[1] - A[1]) * u];
        const O0 = P(rout, b0), O1 = P(rout, b1), I0 = P(rin, b0), I1 = P(rin, b1), g0 = .035; ctx.beginPath(); ctx.moveTo(...mix(O0, O1, g0)); ctx.lineTo(...mix(O0, O1, 1 - g0)); ctx.lineTo(...mix(I0, I1, 1 - g0)); ctx.lineTo(...mix(I0, I1, g0)); ctx.closePath(); }
      else { ctx.beginPath(); ctx.arc(CX, CY, rout, a0, a1); ctx.arc(CX, CY, rin, a1, a0, true); ctx.closePath(); }
      const gg = ctx.createRadialGradient(CX, CY, rin, CX, CY, rout); gg.addColorStop(0, rotating ? '#5a6274' : '#454b58'); gg.addColorStop(1, rotating ? '#3c4250' : '#2b303a'); ctx.fillStyle = gg; ctx.fill();
      ctx.lineWidth = rotating ? 5 : 3; ctx.strokeStyle = rotating ? (rot.linked ? '#ff9f1c' : '#ffe66d') : 'rgba(0,0,0,.5)'; ctx.stroke();
      const am = (a0 + a1) / 2, rm = (rin + rout) / 2 * (HEX ? C30 : 1); drawGem(ring.seq[k], CX + Math.cos(am) * rm, CY + Math.sin(am) * rm, Math.min(RW * (HEX ? .37 : .42), 52), am + Math.PI / 2); }

  });

  LINKS.forEach(([a, b], n) => { const ang = LINK_ANG[n % LINK_ANG.length]; const ra = ringMid(a), rb = ringMid(b); const dir = rb > ra ? 1 : -1;

    ctx.save(); ctx.translate(CX, CY); ctx.rotate(ang); ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  ctx.save(); ctx.translate(CX, CY); ctx.rotate(spin); ctx.beginPath(); ctx.arc(0, 0, rhub, 0, 7); const gc = ctx.createRadialGradient(-30, -30, 10, 0, 0, R0); gc.addColorStop(0, '#d9dee8'); gc.addColorStop(1, '#6b7280'); ctx.fillStyle = gc; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = '#22252c'; ctx.stroke();
  ctx.lineWidth = 20; ctx.lineCap = 'round'; ctx.strokeStyle = '#2b303a'; ctx.beginPath(); for (let k = 0; k < 3; k++) { const a = k * Math.PI / 3; ctx.moveTo(Math.cos(a) * (rhub - 16), Math.sin(a) * (rhub - 16)); ctx.lineTo(-Math.cos(a) * (rhub - 16), -Math.sin(a) * (rhub - 16)); } ctx.stroke();

  for (let s = 0; s < 3; s++) { const y = CY - 160 + s * 170; ctx.fillStyle = '#3a2a1a'; ctx.fillRect(CX - 300, y + 60, 600, 18);
    for (let i = 0; i < 4; i++) { const x = CX - 240 + i * 130 + (s % 2) * 40; ctx.save(); ctx.translate(x, y + 40); ctx.fillStyle = '#f5c542'; ctx.beginPath(); ctx.moveTo(-50, 20); ctx.lineTo(50, 20); ctx.lineTo(38, -20); ctx.lineTo(-38, -20); ctx.closePath(); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(-30, -14, 40, 8); ctx.lineWidth = 3; ctx.strokeStyle = '#a5700f'; ctx.stroke(); ctx.restore(); } }

}
function drawCoin(x, y, r) { ctx.save(); ctx.translate(x, y); const g = ctx.createRadialGradient(-r * .3, -r * .3, r * .2, 0, 0, r); g.addColorStop(0, '#fff3a0'); g.addColorStop(.6, '#f5c542'); g.addColorStop(1, '#c98a12');

// ---------- suivi (branché sur le pixel à l'intégration) ----------
const sent = {};
function track(name, data) { if (sent[name]) return; sent[name] = 1; try { if (window.onDemoEvent) window.onDemoEvent(name, data || {}); } catch (e) {} }

// ---------- état ----------
let levelIdx = 0, tPlay = 0, playRipples = [], won = null, lost = null, coins = 0, shown = 0, bumpAt = -9, gain = 0;

function startLevel(i) { levelIdx = i; const L = LEVELS[i];
  RINGS = L.offs.map(o => ({ seq: BASE, off: o })); ROTS = []; R0 = L.r0; RW = (RDOOR - RIM - R0) / RINGS.length; LINKS = L.links; MOVES0 = L.moves; HEX = !!L.hex;

const movesLeft = () => MOVES0 - moves;

function bestRing() { const L = LEVELS[levelIdx]; const d0 = distOf(L, offs); let best = -1;
  for (let i = 0; i < RINGS.length; i++) if (distOf(L, stepState(offs, moveVec(L, i))) < d0) best = i; return best; }
function worstRing() { const L = LEVELS[levelIdx]; const d0 = distOf(L, offs); let best = -1, bd = -1;
  for (let i = 0; i < RINGS.length; i++) { const d = distOf(L, stepState(offs, moveVec(L, i))); if (d >= d0 && d > bd) { bd = d; best = i; } } return best; }
