<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>Hexa Cascade — démo jouable</title>
<style>
  html,body{margin:0;height:100%;background:#2a221b;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #c{display:block;width:min(100vw,calc(100dvh*9/16));height:auto;aspect-ratio:9/16;background:#d9cfc4;touch-action:none}
  #end{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(30,22,15,.78);padding:20px;box-sizing:border-box}
  #card{background:#fff8ee;border-radius:22px;padding:26px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.45)}
  #card h2{margin:0 0 6px;font-size:28px;color:#3a2a1c}
  #card p{margin:8px 0 18px;font-size:16px;line-height:1.4;color:#5a4a3a}
  .btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-size:20px;font-weight:800;color:#fff;background:#14b8a6;box-shadow:0 6px 0 #0f766e;cursor:pointer}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0f766e}
  .lnk{margin-top:16px;background:none;border:0;color:#8a7a6a;font-size:15px;text-decoration:underline;cursor:pointer}
  #form{display:none;margin-top:4px}
  #form input[type=email]{width:100%;box-sizing:border-box;padding:14px;font-size:17px;border:2px solid #d8c9b6;border-radius:12px;margin-bottom:10px}
  #ok{display:none;font-weight:700;color:#2e7d32;font-size:17px}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="end"><div id="card">
  <h2>Bravo&nbsp;! 🎉</h2>
  <p id="endtxt">Tu as terminé la démo. Le jeu complet arrive bientôt sur Android, avec des centaines de niveaux et une île à faire grandir.</p>
  <button class="btn" id="cta">Je veux le jeu complet</button>
  <div id="form"><p>Laisse ton e-mail pour être prévenu à la sortie.</p>
    <form id="f"><input type="hidden" name="jeu" value="Hexa Cascade (démo)"><input type="email" name="email" placeholder="ton@email.com" required><button class="btn" type="submit">Prévenez-moi</button></form></div>
  <div id="ok">C’est noté ! On te prévient dès la sortie.</div>
  <button class="lnk" id="again">Rejouer la démo</button>
</div></div>
<script>
// Hexa Cascade — démo jouable 3 niveaux (page de test du concept)
const W = 1080, H = 1920;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif'; const STROKE = '#1b2a33';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const tw = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeIn = x => x * x * x;
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

function shade(hex, k) { const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;

//ENGINE-START  (logique pure, partagée avec sim.js — aucune dépendance au canvas)
const POP_N = 7;
const CELLS = []; for (let q = -2; q <= 2; q++) for (let r = -2; r <= 2; r++) if (Math.max(Math.abs(q), Math.abs(r), Math.abs(q + r)) <= 2) CELLS.push([q, r]);

const LEVELS = [
  { colors: ['red', 'blue'], target: 21, blocked: [], seed: 101, minN: 2, maxN: 4, mixP: 0,
    pre: [[-1, 0, rep('red', 4)], [1, 0, rep('blue', 4)]],
    first: [rep('red', 3), rep('blue', 3), rep('red', 3)] },
  { colors: ['red', 'blue', 'yellow'], target: 49, blocked: ['0,-2', '0,2'], seed: 202, minN: 2, maxN: 4, mixP: .5,
    pre: [[-1, -1, rep('yellow', 3)], [1, 0, rep('red', 3)], [-1, 1, rep('blue', 2)]] },
  { colors: ['red', 'blue', 'yellow', 'green'], target: 63, blocked: ['0,0', '-2,2', '2,-2'], seed: 303, minN: 2, maxN: 4, mixP: .6,

  b[k].push(...G.tray[slot]); const p = resolveLogic(b, [k], null);

  for (const kk in b) { const st = b[kk]; if (!st.length) { s += 8; continue; } let sg = 0; for (let i = 1; i < st.length; i++) if (st[i] !== st[i - 1]) sg++; const tr = topRun(st); s += tr * tr * .3 - sg * 5 - st.length * .5; }

//ENGINE-END

// ---------- géométrie hex (pointe en haut) ----------

  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();

const MOVE = .16, STEP = .022, DROP = .12, POP_PAUSE = .26, POP_DUR = .3;

// ---------- dessin ----------
function drawTile(color, x, y, alpha, scale) {

  hexPath(0, TH, R - 12); ctx.fillStyle = shade(COL[color], -.45); ctx.fill();
  hexPath(0, 0, R - 12); const g = ctx.createLinearGradient(-R, -R, R, R); g.addColorStop(0, shade(COL[color], .3)); g.addColorStop(1, shade(COL[color], -.15)); ctx.fillStyle = g; ctx.fill();

  hexPath(0, 0, R - 30); ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}
function drawCoin(x, y, r) { ctx.save(); ctx.translate(x, y); const g = ctx.createRadialGradient(-r * .3, -r * .3, r * .2, 0, 0, r); g.addColorStop(0, '#fff3a0'); g.addColorStop(.6, '#f5c542'); g.addColorStop(1, '#c98a12');
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = r * .12; ctx.strokeStyle = '#8a5a00'; ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, r * .62, 0, 7); ctx.stroke(); ctx.restore(); }
function drawCounter(value, bump = 0, cy = 330) { ctx.save(); ctx.translate(W - 60, cy); ctx.scale(1 + bump, 1 + bump);
  ctx.beginPath(); rr(-330, -52, 330, 104, 52); ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fill();
  drawCoin(-270, 0, 40); ctx.font = `bold 64px ${FONT}`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(String(value), -40, 4); ctx.restore(); }
function drawRipple(x, y, u) {
  if (u <= 0 || u >= 1) return;
  ctx.save(); ctx.globalAlpha = (1 - u) * .8; ctx.lineWidth = 10; ctx.strokeStyle = '#fff';
  ctx.beginPath(); ctx.arc(x, y, 25 + u * 110, 0, 7); ctx.stroke(); ctx.restore();
}
function drawX(x, y, u) {
  if (u <= 0) return; const s = back(clamp(u * 3, 0, 1));
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.lineWidth = 18; ctx.lineCap = 'round'; ctx.strokeStyle = '#ff3b3b';
  ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.moveTo(-40, -40); ctx.lineTo(40, 40); ctx.moveTo(40, -40); ctx.lineTo(-40, 40); ctx.stroke(); ctx.restore();
}
function drawBanner(text, u, y = 230, size = 96) {
  if (u <= 0) return; const s = .6 + .4 * back(clamp(u, 0, 1)); const lines = text.split('\n'); if (lines.length > 1) size = 80;
  ctx.save(); ctx.translate(W / 2, y + (lines.length - 1) * 30); ctx.scale(s, s);
  ctx.font = `bold ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  lines.forEach((ln, i) => { const yy = (i - (lines.length - 1) / 2) * size * 1.15;
    ctx.save(); ctx.lineJoin = 'round'; ctx.lineWidth = 22; ctx.strokeStyle = STROKE; ctx.strokeText(ln, 0, yy);
    ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 6; ctx.fillStyle = '#fff'; ctx.fillText(ln, 0, yy); ctx.restore(); });

}
function pill(x, y, w, h, text) { ctx.save(); rr(x, y, w, h, h / 2); ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fill();
  ctx.font = `bold 52px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(text, x + w / 2, y + h / 2 + 3); ctx.restore(); }
function ring(x, y, r0) { const u = (tReal * 1.2) % 1; ctx.save(); ctx.globalAlpha = 1 - u; ctx.lineWidth = 12; ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r0 + u * 60, 0, 7); ctx.stroke();
  ctx.globalAlpha = 1; ctx.lineWidth = 8; ctx.strokeStyle = '#ffd166'; ctx.beginPath(); ctx.arc(x, y, r0 + 2, 0, 7); ctx.stroke(); ctx.restore(); }

const sent = {};

// ---------- état ----------
let G, levelIdx = 0, tReal = 0, ta = 0, tiles = [], vis = {}, pops = [], animEnd = 0, selected = -1, drag = null, trayAt = 0;

let playX = [], playRipples = [], hintCache = null, lastPopped = 0, popCount = 0;
function startLevel(i) {

  wonAt = null; lostAt = null; wonSent = false; coinsAtStart = coins; lastTap = tReal; msg = null; playX = []; hintCache = null; lastPopped = 0;
  for (const k in G.board) { vis[k] = []; G.board[k].forEach((c, idx) => { const tile = { color: c, kf: [{ t: -1, k, idx, dur: 0 }] }; vis[k].push(tile); tiles.push(tile); }); }
}
function hint() { // meilleur coup glouton, en respectant la pile déjà sélectionnée

function place(slot, k, fx, fy) {

  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#2f6f8f'); g.addColorStop(1, '#173a4f'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
